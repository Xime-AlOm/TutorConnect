<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorConnect · Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-100">

  <!-- Cabecera -->
  <header class="bg-blue-900 text-white">
    <div class="max-w-5xl mx-auto flex items-center justify-between p-4">
      <a href="panel.html" class="text-xl font-bold">TutorConnect</a>
      <div class="flex items-center gap-4 text-sm">
        <span id="cabecera-usuario" class="hidden sm:inline"></span>
        <a href="perfil.html" class="hover:underline">Mi perfil</a>
        <button id="btn-salir" class="rounded-lg bg-white/10 px-3 py-1 hover:bg-white/20">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-6">
    <!-- Mensaje de error -->
    <div id="panel-error" class="hidden rounded-lg bg-red-100 text-red-700 text-sm p-3" role="alert"></div>

    <!-- Saludo -->
    <section>
      <h1 id="saludo" class="text-2xl font-bold text-slate-800">Cargando…</h1>
      <p id="rol-texto" class="text-slate-500"></p>
    </section>

    <!-- Accesos directos según el rol -->
    <section>
      <h2 class="text-lg font-semibold text-slate-700 mb-3">Accesos directos</h2>
      <div id="accesos" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Skeleton mientras carga -->
        <div class="h-24 rounded-xl bg-slate-200 animate-pulse"></div>
        <div class="h-24 rounded-xl bg-slate-200 animate-pulse"></div>
        <div class="h-24 rounded-xl bg-slate-200 animate-pulse"></div>
      </div>
    </section>

    <!-- Próximas citas (24 h) -->
    <section id="seccion-proximas">
      <h2 class="text-lg font-semibold text-slate-700 mb-3">Próximas citas (24 h)</h2>
      <div id="proximas" class="space-y-3">
        <p class="text-slate-500">No tienes citas en las próximas 24 horas.</p>
      </div>
    </section>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
