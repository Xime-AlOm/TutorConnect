<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorConnect - Inicio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-[#F8FAFC] flex min-h-screen w-full m-0 p-0 overflow-x-hidden flex-col">

  <!-- Header a todo lo ancho -->
  <header class="bg-[#1B396A] text-white w-full shadow-sm">
    <div class="w-full px-4 sm:px-6 lg:px-12 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer">
        <span class="bg-white text-[#1B396A] font-bold px-2.5 py-1 rounded text-xs tracking-wider shadow-sm">TecNM</span>
        <span class="font-bold text-lg tracking-tight">TutorConnect</span>
      </div>
      
      <!-- Navegación Responsiva -->
      <nav class="hidden md:flex space-x-8 text-sm font-medium">
        <a href="panel.html" class="border-b-2 border-white pb-1 text-white">Inicio</a>
        <a href="buscar.html" data-rol="Estudiante" class="text-slate-300 hover:text-white transition">Buscar asesoría</a>
        <a href="solicitudes.html" data-rol="Estudiante,Profesor" class="text-slate-300 hover:text-white transition">Mis solicitudes</a>
        <a href="postulacion.html" data-rol="Estudiante,Profesor" class="text-slate-300 hover:text-white transition">Postular como tutor</a>
        <a href="admin.html" data-rol="Coordinador" class="hidden text-slate-300 hover:text-white transition">Administración</a>
        <a href="perfil.html" class="text-slate-300 hover:text-white transition">Perfil</a>
      </nav>
      
      <div class="flex items-center space-x-4">
        <!-- Notificaciones -->
        <button id="btn-campana" aria-label="Notificaciones" class="relative text-white hover:text-slate-300 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          <span id="campana-punto" class="hidden absolute top-0 right-0 block h-2.5 w-2.5 rounded-full bg-rose-500 ring-2 ring-[#1B396A]"></span>
        </button>
        <!-- Badge de Usuario -->
        <div id="avatar-iniciales" title="" class="w-8 h-8 rounded-full bg-blue-400 flex items-center justify-center font-bold text-xs shadow-sm border border-blue-500">
          
        </div>
        <button id="btn-cerrar-sesion" class="hidden sm:inline-block text-xs font-semibold text-slate-200 hover:text-white border border-slate-400 hover:border-white rounded-lg px-3 py-1.5 transition">
          Cerrar sesión
        </button>
        <button class="md:hidden text-white hover:text-slate-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal (w-full) -->
  <main class="w-full px-4 sm:px-6 lg:px-12 py-8 flex-1 flex flex-col md:flex-row gap-8">
    
    <!-- Columna Izquierda: Bienvenida y Accesos Rápidos -->
    <div class="w-full md:w-1/3 flex flex-col space-y-6">
      
      <!-- Tarjeta de Perfil Resumido -->
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        <h1 id="saludo" class="text-2xl font-bold text-slate-900 tracking-tight">Hola.</h1>
        <p id="rol-texto" class="text-sm text-slate-500 mt-1">Cargando…</p>
        
        <!-- Accesos según el rol (los genera js/panel.js) -->
        <div id="accesos" class="mt-6 flex flex-col space-y-3">
          <div class="h-10 rounded-lg bg-slate-100 animate-pulse"></div>
          <div class="h-10 rounded-lg bg-slate-100 animate-pulse"></div>
        </div>
      </div>

      <!-- Centro de Notificaciones Corto -->
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex-1">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-900">Notificaciones</h2>
          <span id="btn-marcar-leidas" class="hidden text-[11px] font-bold text-[#1B396A] bg-blue-50 px-2 py-0.5 rounded cursor-pointer hover:bg-blue-100 transition">Marcar leídas</span>
        </div>
        
        <!-- Bandeja de avisos (se conecta en T21 · notificaciones internas) -->
        <ul id="lista-notificaciones" class="space-y-4">
          <li class="text-sm text-slate-500">No tienes notificaciones nuevas.</li>
        </ul>
      </div>
    </div>

    <!-- Columna Derecha: citas aceptadas de las próximas 24 h (v_mis_citas.es_proxima) -->
    <div id="seccion-proximas" class="w-full md:w-2/3">
      
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-bold text-slate-900">Próximas citas</h2>
        <a href="solicitudes.html" class="text-sm font-semibold text-[#0284c7] hover:underline">Ver historial completo →</a>
      </div>
      
      <div id="proximas" class="space-y-4">
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-sm text-slate-500">
          No tienes citas en las próximas 24 horas.
        </div>
      </div>
    </div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/sesion.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
