<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorConnect · Mi perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-100">

  <header class="bg-blue-900 text-white">
    <div class="max-w-5xl mx-auto flex items-center justify-between p-4">
      <a href="panel.html" class="text-xl font-bold">TutorConnect</a>
      <div class="flex items-center gap-4 text-sm">
        <a href="panel.html" class="hover:underline">Panel</a>
        <button id="btn-salir" class="rounded-lg bg-white/10 px-3 py-1 hover:bg-white/20">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4">
    <div id="perfil-error" class="hidden mb-4 rounded-lg bg-red-100 text-red-700 text-sm p-3" role="alert"></div>

    <section class="rounded-2xl bg-white p-6 shadow">
      <h1 class="text-2xl font-bold text-slate-800 mb-1">Mi perfil</h1>
      <p id="perfil-rol" class="mb-6 inline-block rounded-full bg-blue-100 px-3 py-1 text-sm font-medium text-blue-900">…</p>

      <!-- Datos en modo lectura -->
      <dl id="perfil-datos" class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="h-12 rounded bg-slate-200 animate-pulse"></div>
        <div class="h-12 rounded bg-slate-200 animate-pulse"></div>
      </dl>

      <!-- Promedio como asesor (solo si tiene evaluaciones o es asesor) -->
      <div id="perfil-promedio" class="hidden mt-6 rounded-xl bg-amber-50 p-4">
        <p class="text-sm text-slate-600">Calificación como asesor</p>
        <p id="promedio-valor" class="text-2xl font-bold text-amber-600"></p>
      </div>
    </section>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
