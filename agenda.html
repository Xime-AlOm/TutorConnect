<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorConnect - Mi Agenda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/franjas.js" defer></script>
</head>
<body>

  <!-- Header a todo lo ancho -->
  <header class="bg-[#1B396A] text-white w-full shadow-sm">
    <div class="w-full px-4 sm:px-6 lg:px-12 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer">
        <span class="bg-white text-[#1B396A] font-bold px-2.5 py-1 rounded text-xs tracking-wider shadow-sm">TecNM</span>
        <span class="font-bold text-lg tracking-tight">TutorConnect</span>
      </div>

      <!-- Navegación Responsiva -->
      <nav class="hidden md:flex space-x-8 text-sm font-medium">
        <a href="panel.html" class="text-slate-300 hover:text-white transition">Inicio</a>
        <a href="buscar.html" data-rol="Estudiante" class="text-slate-300 hover:text-white transition">Buscar asesoría</a>
        <a href="solicitudes.html" data-rol="Estudiante,Profesor" class="text-slate-300 hover:text-white transition">Mis solicitudes</a>
        <a href="postulacion.html" data-rol="Estudiante,Profesor" class="text-slate-300 hover:text-white transition">Postular como tutor</a>
        <a href="agenda.html" data-asesor class="border-b-2 border-white pb-1 text-white">Mi agenda</a>
        <a href="admin.html" data-rol="Coordinador" class="hidden text-slate-300 hover:text-white transition">Administración</a>
        <a href="perfil.html" class="text-slate-300 hover:text-white transition">Perfil</a>
      </nav>

      <div class="flex items-center space-x-4">
        <!-- Notificaciones -->
        <button id="btn-campana" aria-label="Notificaciones" class="relative text-white hover:text-slate-300 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          <span id="campana-punto" class="hidden absolute top-0 right-0 block h-2.5 w-2.5 rounded-full bg-rose-500 ring-2 ring-[#1B396A]"></span>
        </button>
        <!-- Badge de Usuario -->
        <div id="avatar-iniciales" title="" class="w-8 h-8 rounded-full bg-blue-400 flex items-center justify-center font-bold text-xs shadow-sm border border-blue-500"></div>
        <button id="btn-cerrar-sesion" class="hidden sm:inline-block text-xs font-semibold text-slate-200 hover:text-white border border-slate-400 hover:border-white rounded-lg px-3 py-1.5 transition">
          Cerrar sesión
        </button>
        <button class="md:hidden text-white hover:text-slate-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="w-full px-4 sm:px-6 lg:px-12 py-8 flex-1">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Mi agenda de atención</h1>
        <p class="text-sm text-slate-500 mt-1">Bloques de una hora publicados</p>
      </div>
      <button onclick="abrirModalPublicar()" class="bg-[#1B396A] hover:bg-[#13274A] text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition w-full sm:w-auto">
        + Publicar nuevo horario
      </button>
    </div>

    <!-- Tabla responsiva sin recortes -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm w-full overflow-x-auto">
      <table class="w-full min-w-[700px] text-left text-sm text-slate-600">
        <thead class="bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">
          <tr>
            <th class="px-5 py-4">Fecha</th>
            <th class="px-5 py-4">Horario</th>
            <th class="px-5 py-4">Materia</th>
            <th class="px-5 py-4">Modalidad</th>
            <th class="px-5 py-4">Estado</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr class="hover:bg-slate-50 transition">
            <td class="px-5 py-4">15/10/2026</td>
            <td class="px-5 py-4">10:00 - 11:00</td>
            <td class="px-5 py-4 font-bold text-slate-900">Estructura de Datos</td>
            <td class="px-5 py-4">Virtual</td>
            <td class="px-5 py-4">
              <span class="bg-amber-100 text-amber-800 border border-amber-200 px-2.5 py-1 rounded text-xs font-bold whitespace-nowrap">Congelado · pendiente</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/sesion.js"></script>
<script>
  iniciarPaginaProtegida();
</script>
</body>
</html>
