<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorConnect - Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-[#F8FAFC] flex min-h-screen w-full m-0 p-0 overflow-x-hidden flex-col">

  <!-- Header a todo lo ancho -->
  <header class="bg-[#1B396A] text-white w-full shadow-sm">
    <div class="w-full px-4 sm:px-6 lg:px-12 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer">
        <span class="bg-white text-[#1B396A] font-bold px-2.5 py-1 rounded text-xs tracking-wider shadow-sm">TecNM</span>
        <span class="font-bold text-lg tracking-tight">TutorConnect</span>
      </div>
      
      <!-- Navegación Responsiva -->
      <nav class="hidden md:flex space-x-8 text-sm font-medium">
        <a href="index.html" class="text-slate-300 hover:text-white transition">Inicio</a>
        <a href="admin.html" class="border-b-2 border-white pb-1 text-white">Administración</a>
        <a href="buscar.html" class="text-slate-300 hover:text-white transition">Catálogo</a>
        <a href="perfil.html" class="text-slate-300 hover:text-white transition">Perfil</a>
      </nav>
      
      <div class="flex items-center space-x-4">
        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-900 flex items-center justify-center font-bold text-xs shadow-sm border border-indigo-200">
          CO
        </div>
        <button class="md:hidden text-white hover:text-slate-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="w-full px-4 sm:px-6 lg:px-12 py-8 flex-1">
    
    <!-- Título y Botón Agregar -->
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Catálogo de materias</h1>
        <p class="text-slate-500 text-sm mt-1">Administra las materias oficiales para las asesorías.</p>
      </div>
      <button id="btnNuevaMateria" class="bg-[#1B396A] hover:bg-[#13274A] text-white px-4 py-2.5 rounded font-bold shadow-sm transition flex items-center justify-center">
        + Agregar materia
      </button>
    </div>

    <!-- Filtros -->
    <div class="flex flex-col sm:flex-row gap-4 mb-6">
      <input type="text" id="buscadorMateria" placeholder="Buscar por nombre..." class="border border-slate-300 rounded px-3 py-2 flex-1 focus:outline-none focus:border-[#1B396A]">
      <select id="filtroCarrera" class="border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-[#1B396A]">
        <option value="">Todas las carreras</option>
      </select>
      <select id="filtroEstado" class="border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-[#1B396A]">
        <option value="todas">Todas</option>
        <option value="activas">Activas</option>
        <option value="inactivas">Inactivas</option>
      </select>
    </div>

    <!-- Tabla de Materias -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col">
      <div class="overflow-x-auto w-full rounded-lg flex-1">
        <table class="w-full min-w-[600px] text-left text-sm text-slate-700">
          <thead class="bg-slate-100 border-b border-slate-200 text-slate-600 font-bold">
            <tr>
              <th class="px-4 py-3">Materia</th>
              <th class="px-4 py-3">Carrera</th>
              <th class="px-4 py-3 text-center">Estado</th>
              <th class="px-4 py-3 text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaMaterias" class="divide-y divide-slate-100 bg-white">
            <!-- Contenido dinámico -->
          </tbody>
        </table>
        <!-- Estado Vacío (Oculto por defecto) -->
        <div id="estadoVacio" class="hidden flex flex-col items-center justify-center py-12 text-slate-500">
          <p class="mb-4">Aún no hay materias en el catálogo o no coinciden con la búsqueda.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal de Alta/Edición -->
  <div id="modalMateria" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 bg-slate-50">
        <h2 id="modalTitulo" class="text-lg font-bold text-slate-900">Agregar materia</h2>
      </div>
      <form id="formMateria" class="p-6">
        <input type="hidden" id="materiaId">
        
        <div class="mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-1">Nombre de la materia</label>
          <input type="text" id="materiaNombre" required maxlength="100" class="w-full border border-slate-300 px-3 py-2 rounded focus:outline-none focus:border-[#1B396A]" placeholder="Ej. Cálculo Diferencial">
        </div>
        
        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-1">Carrera</label>
          <select id="materiaCarrera" required class="w-full border border-slate-300 px-3 py-2 rounded focus:outline-none focus:border-[#1B396A]">
            <option value="">Selecciona una carrera</option>
          </select>
        </div>
        
        <!-- Mensaje de error -->
        <p id="modalError" class="hidden text-rose-600 text-sm mb-4 font-medium"></p>
        
        <div class="flex justify-end space-x-3">
          <button type="button" id="btnCerrarModal" class="px-4 py-2 border border-slate-300 text-slate-700 rounded hover:bg-slate-50 font-medium transition">Cancelar</button>
          <button type="submit" id="btnGuardarMateria" class="px-4 py-2 bg-[#1B396A] text-white rounded hover:bg-[#13274A] font-medium transition">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Contenedor para Toasts -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Scripts: Supabase y Lógica -->
  <!-- Nota: Asegúrate de que js/supabase.js inicialice la conexión y exponga 'db' o 'supabase' -->
  <script src="js/supabase.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/catalogo.js"></script>
  
  <script>
    // 1. Protección de la página (redirige si no es Coordinador)
    if(typeof exigirRol === 'function') {
      exigirRol('Coordinador');
    }
  </script>
</body>
</html>
